<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
:root {
  --bg: #fbfaf8;
  --fg: #1d1b20;
  --muted: #6b6570;
  --line: #e4dfe8;
  --accent: #5b2c6f;          /* o mesmo roxo das caixas "Pratica agora" do PDF */
  --accent-soft: #f4ecf7;
  --card: #ffffff;
  --code-bg: #f3f1f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151a;
    --fg: #ece8ef;
    --muted: #a39ca8;
    --line: #34303a;
    --accent: #c9a2dc;
    --accent-soft: #2a2230;
    --card: #1f1c23;
    --code-bg: #26222b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main { max-width: 820px; margin: 0 auto; padding: 24px 16px 96px; }
header h1 { font-size: 1.7rem; line-height: 1.25; margin: 8px 0 4px; }
header p { color: var(--muted); margin: 0 0 16px; }
.barra {
  position: sticky; top: 0; z-index: 5;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 10px 0; margin-bottom: 8px;
  background: var(--bg); border-bottom: 1px solid var(--line);
  font-size: 0.9rem; color: var(--muted);
}
.barra button {
  font: inherit; color: var(--accent); background: none;
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
.barra label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
nav#indice { margin: 16px 0 24px; }
nav#indice > details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
nav#indice ul { margin: 6px 0; padding-left: 20px; }
nav#indice a { color: inherit; text-decoration: none; }
nav#indice a:hover { color: var(--accent); text-decoration: underline; }
h2 {
  font-size: 1.35rem; margin: 48px 0 8px; padding-bottom: 6px;
  border-bottom: 2px solid var(--accent);
}
h3 { font-size: 1.1rem; margin: 32px 0 6px; color: var(--accent); scroll-margin-top: 56px; }
details.sol {
  background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  margin: 8px 0; scroll-margin-top: 56px;
}
details.sol > summary {
  cursor: pointer; padding: 10px 14px; list-style: none;
  display: flex; gap: 10px; align-items: baseline;
}
details.sol > summary::-webkit-details-marker { display: none; }
details.sol > summary::before {
  content: "▸"; color: var(--accent); flex: none; transition: transform .15s;
}
details.sol[open] > summary::before { transform: rotate(90deg); }
details.sol[open] { border-color: var(--accent); }
details.sol[open] > summary { background: var(--accent-soft); border-radius: 8px 8px 0 0; }
details.sol > .corpo { padding: 4px 16px 12px; overflow-x: auto; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.88em; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
:not(pre) > code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
th { background: var(--accent-soft); }
img { max-width: 100%; height: auto; display: block; margin: 8px auto; }
@media (prefers-color-scheme: dark) { img { filter: invert(0.9) hue-rotate(180deg); } }
blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--accent); color: var(--muted); }
math[display="block"] { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
</style>
</head>
<body>
<main>
<header>
<h1>$title$</h1>
$if(subtitle)$<p>$subtitle$</p>$endif$
</header>

<div class="barra">
  <span>Clica numa alínea para ver a solução.</span>
  <label><input type="checkbox" id="uma" checked> Só uma aberta de cada vez</label>
  <button type="button" id="fechar">Fechar todas</button>
</div>

$if(toc)$
<nav id="indice"><details><summary>Índice</summary>
$table-of-contents$
</details></nav>
$endif$

$body$
</main>
<script>
(function () {
  var sols = Array.prototype.slice.call(document.querySelectorAll("details.sol"));
  var uma = document.getElementById("uma");
  try { var g = localStorage.getItem("solucoes-uma"); if (g !== null) uma.checked = g === "1"; } catch (e) {}
  uma.addEventListener("change", function () {
    try { localStorage.setItem("solucoes-uma", uma.checked ? "1" : "0"); } catch (e) {}
  });
  sols.forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (!d.open) return;
      if (uma.checked) sols.forEach(function (o) { if (o !== d && o.open) o.open = false; });
      // depois de fechar as outras a página pode "saltar": manter a alínea à vista
      var r = d.getBoundingClientRect();
      if (r.top < 48 || r.top > window.innerHeight * 0.6) d.scrollIntoView({ block: "start" });
      if (history.replaceState) history.replaceState(null, "", "#" + d.id);
    });
  });
  document.getElementById("fechar").addEventListener("click", function () {
    sols.forEach(function (o) { o.open = false; });
  });
  // abrir diretamente uma alínea com #id no URL
  var h = decodeURIComponent(location.hash.slice(1));
  var alvo = h && document.getElementById(h);
  if (alvo && alvo.tagName === "DETAILS") { alvo.open = true; alvo.scrollIntoView({ block: "start" }); }
})();
</script>
</body>
</html>
